services:
  db:
    image: postgres:16-alpine
    container_name: mtec_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtec_ops}
      POSTGRES_USER: ${POSTGRES_USER:-mtec_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtec_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtec_user} -d ${POSTGRES_DB:-mtec_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/your-org/mtec-operations-hub-backend:latest}
    container_name: mtec_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mtec_user}:${POSTGRES_PASSWORD:-mtec_pass}@db:5432/${POSTGRES_DB:-mtec_ops}
      AUTO_CREATE_TABLES: "false"
      ENABLE_SEED_DATA: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: mtec_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
